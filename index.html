<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipedia &mdash; Machine Knowledge Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">&#9881;</div>
        <div class="brand-text">
          <h1>Equipedia</h1>
          <p>Machine Knowledge Hub</p>
        </div>
      </div>
      <div class="header-spacer"></div>
      <div class="search-box">
        <input id="search" type="text" placeholder="Search machines..." autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Machine Directory</h2>
      <div class="stats">
        <div class="stat">
          <div class="value" id="statTotal">0</div>
          <div class="label">Machines</div>
        </div>
        <div class="stat">
          <div class="value" id="statOnline">0</div>
          <div class="label">Running</div>
        </div>
        <div class="stat">
          <div class="value" id="statCategories">0</div>
          <div class="label">Departments</div>
        </div>
      </div>
    </section>

    <div class="filters" id="filters"></div>

    <section class="grid" id="grid"></section>
  </main>

  <footer class="site-footer">
    <div class="container">Equipedia &middot; Internal machine reference</div>
  </footer>

  <script src="js/machines.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
